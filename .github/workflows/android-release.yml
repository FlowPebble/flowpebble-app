name: FlowPebble Android Release & Play Store CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      generate_new_keystore:
        description: 'Generate a brand-new upload keystore (.jks + Base64) in workflow artifacts if you do not have one yet'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "flowpebble-ci-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Optional 100% Smartphone Keystore Generator Job (runs only when requested via workflow_dispatch)
  generate-keystore:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_new_keystore == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Upload Keystore & Base64 Bundle
        shell: bash
        env:
          KEY_ALIAS_IN: ${{ secrets.KEY_ALIAS }}
          KEY_PASS_IN: ${{ secrets.KEY_PASSWORD }}
          STORE_PASS_IN: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          ALIAS="${KEY_ALIAS_IN:-flowpebble-key}"
          KPASS="${KEY_PASS_IN:-FlowPebbleStrongPass2026!}"
          SPASS="${STORE_PASS_IN:-FlowPebbleStrongPass2026!}"
          mkdir -p keystore-bundle
          keytool -genkeypair -v \
            -keystore keystore-bundle/flowpebble-upload.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" \
            -storepass "$SPASS" \
            -keypass "$KPASS" \
            -dname "CN=FlowPebble, OU=Mobile Engineering, O=FlowPebble, L=Addis Ababa, ST=AA, C=ET"
          base64 -w 0 keystore-bundle/flowpebble-upload.jks > keystore-bundle/KEYSTORE_BASE64.txt
          cat > keystore-bundle/README_SECRETS_SETUP.txt <<EOF
          ==================================================================
          FLOWPEBBLE UPLOAD KEYSTORE GENERATED SUCCESSFULLY (100% ON CLOUD)
          ==================================================================
          Copy the single-line text inside KEYSTORE_BASE64.txt and save it
          as your GitHub Repository Secret named: KEYSTORE_BASE64
          EOF

      - name: Upload Generated Keystore Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowpebble-generated-keystore-DO-NOT-SHARE
          path: keystore-bundle/
          retention-days: 3

  # Main Native Kotlin Android Release Build, Signing & Play Graphics Job
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Unpack ZIP Archives Uploaded from Smartphone Browser
        shell: bash
        run: |
          set -euo pipefail
          UNPACKED=0
          if [ ! -f "settings.gradle.kts" ]; then
            for z in flowpebble-app-complete*.zip *complete*.zip; do
              if [ -f "$z" ]; then
                echo "Detected smartphone-uploaded project archive: $z — unpacking automatically..."
                unzip -q -o "$z" -d /tmp/fp_unpack
                if [ -d "/tmp/fp_unpack/flowpebble-app" ]; then
                  find /tmp/fp_unpack/flowpebble-app -maxdepth 1 -mindepth 1 ! -name '.github' -exec cp -rf {} . \;
                else
                  find /tmp/fp_unpack -maxdepth 1 -mindepth 1 ! -name '.github' -exec cp -rf {} . \;
                fi
                rm -rf /tmp/fp_unpack
                UNPACKED=1
                break
              fi
            done
          fi
          if [ -f "flowpebble-play-store-graphics.zip" ]; then
            echo "Detected flowpebble-play-store-graphics.zip — unpacking into play-store-graphics/..."
            mkdir -p play-store-graphics
            unzip -q -o "flowpebble-play-store-graphics.zip" -d play-store-graphics
            UNPACKED=1
          fi
          if [ "$UNPACKED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): auto-unpack project & graphics ZIP archives uploaded from smartphone [skip ci]"
              git push origin HEAD:main || true
            fi
          fi

      - name: Set up JDK 17 (Temurin) with Gradle Caching
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Pre-Installed Android SDK 35 & Licenses (Bypasses Deprecated 'tools' Package Error)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ensure Gradle Wrapper is Executable & Bootstrapped
        shell: bash
        run: |
          chmod +x gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.10.2
          fi

      - name: Decode & Verify Upload Keystore from GitHub Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KESTORE_BASE64: ${{ secrets.KESTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          B64_SECRET="${KEYSTORE_BASE64:-$KESTORE_BASE64}"
          if [ -n "$B64_SECRET" ]; then
            echo "Decoding production upload keystore from GitHub Secrets..."
            printf '%s' "$B64_SECRET" | base64 --decode -i > app/release-keystore.jks
            # Auto-verify alias inside the decoded keystore so there is never an alias mismatch
            if [ -n "$STORE_PASSWORD" ]; then
              DETECTED_ALIAS=$(keytool -list -v -keystore app/release-keystore.jks -storepass "$STORE_PASSWORD" 2>/dev/null | awk '/Alias name:/ {print $3; exit}' || true)
              if [ -n "$DETECTED_ALIAS" ] && [ "$DETECTED_ALIAS" != "$KEY_ALIAS" ]; then
                echo "Detected keystore alias '$DETECTED_ALIAS' inside .jks — exporting to build environment."
                echo "RESOLVED_KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
              else
                echo "RESOLVED_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
              fi
            else
              echo "RESOLVED_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            fi
          else
            echo "WARNING: KEYSTORE_BASE64 is not set yet. Generating temporary keystore so CI build succeeds..."
            ALIAS="${KEY_ALIAS:-flowpebble-key}"
            KPASS="${KEY_PASSWORD:-FlowPebbleTempPass2026!}"
            SPASS="${STORE_PASSWORD:-FlowPebbleTempPass2026!}"
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$ALIAS" \
              -storepass "$SPASS" \
              -keypass "$KPASS" \
              -dname "CN=FlowPebble, OU=Mobile, O=FlowPebble, L=Addis Ababa, ST=AA, C=ET"
            echo "RESOLVED_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          fi

      - name: Render High-Resolution Google Play Console Graphics
        shell: bash
        run: |
          python3 -m pip install --upgrade pip pillow
          python3 scripts/generate_play_graphics.py

      - name: Run Lint, Unit Tests, Signed Release Bundle (.aab) & Signed APK (.apk)
        shell: bash
        env:
          KEY_ALIAS: ${{ env.RESOLVED_KEY_ALIAS != '' && env.RESOLVED_KEY_ALIAS || secrets.KEY_ALIAS || 'flowpebble-key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'FlowPebbleTempPass2026!' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'FlowPebbleTempPass2026!' }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          ./gradlew lintRelease testReleaseUnitTest bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Release AAB, Signed APK, R8 Mapping.txt & Play Store Graphics
        uses: actions/upload-artifact@v4
        with:
          name: flowpebble-play-store-release-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            play-store-graphics/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Securely Wipe Keystore from Runner Disk
        if: always()
        shell: bash
        run: |
          rm -f app/release-keystore.jks

  # Automatic GitHub Pages Deployment for Legal & AdMob Verification (/docs)
  deploy-legal-pages:
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Unpack /docs from ZIP if Needed
        shell: bash
        run: |
          if [ ! -d "docs" ]; then
            for z in flowpebble-app-complete*.zip *complete*.zip; do
              if [ -f "$z" ]; then
                unzip -q -o "$z" -d /tmp/fp_docs
                if [ -d "/tmp/fp_docs/flowpebble-app/docs" ]; then
                  cp -rf /tmp/fp_docs/flowpebble-app/docs ./docs
                fi
                break
              fi
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload /docs Legal & App-Ads.txt Directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
